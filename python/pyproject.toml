[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memoclaw"
version = "1.1.0"
description = "Official Python SDK for the MemoClaw memory API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MemoClaw", email = "hello@memoclaw.com" },
]
keywords = ["memoclaw", "memory", "ai", "agents", "semantic-search"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "eth-account>=0.13",
]

[project.optional-dependencies]
x402 = ["x402[httpx,evm]"]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.11"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "langchain-core>=0.2",
    "llama-index-core>=0.11",
]

[project.urls]
Homepage = "https://memoclaw.com"
Documentation = "https://docs.memoclaw.com"
Repository = "https://github.com/anajuliabit/memoclaw-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/memoclaw"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# The ``list()`` method on client classes intentionally shadows the built-in;
# suppress the resulting false-positive valid-type errors inside class bodies.
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["memoclaw"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
